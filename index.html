<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Koopgeheugen</title>
<style>
  :root {
    --bg: #f6f5f2;
    --card: #ffffff;
    --text: #1c1b19;
    --muted: #6b6862;
    --border: #e5e2da;
    --accent: #5b6d5b;
    --accent-text: #ffffff;
    --danger: #b1453f;
    --star: #d9a441;
    --star-off: #d8d5cd;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --card: #212225;
      --text: #ede9e2;
      --muted: #9a968d;
      --border: #34363a;
      --accent: #8faa8b;
      --accent-text: #12130f;
      --danger: #e08078;
      --star: #e3b358;
      --star-off: #3b3c3e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 16px 16px 80px; }
  header.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0 18px;
  }
  header.topbar h1 { font-size: 19px; margin: 0; letter-spacing: -0.01em; }
  header.topbar .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
  button {
    font: inherit; cursor: pointer; border: none; border-radius: 10px;
    padding: 12px 16px; background: var(--accent); color: var(--accent-text);
    font-weight: 600;
  }
  button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); font-weight: 500; }
  button.danger { background: var(--danger); color: #fff; }
  button.ghost { background: transparent; color: var(--accent); padding: 8px 10px; font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  input, textarea, select {
    width: 100%; font: inherit; padding: 12px 13px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  label { font-size: 13px; color: var(--muted); display: block; margin: 14px 0 6px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 16px; margin-bottom: 14px;
  }
  .hidden { display: none !important; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; }
  .row > * { flex: 1; }
  .center { text-align: center; }
  .error { color: var(--danger); font-size: 13px; margin-top: 8px; }
  .muted { color: var(--muted); font-size: 13px; }

  .scan-cta {
    width: 100%; padding: 22px; font-size: 17px; border-radius: 18px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .manual-entry { display: flex; gap: 8px; margin-top: 10px; }

  .scan-list-item {
    display: flex; gap: 12px; align-items: center; padding: 10px 0;
    border-bottom: 1px solid var(--border); cursor: pointer;
  }
  .scan-list-item:last-child { border-bottom: none; }
  .thumb {
    width: 46px; height: 46px; border-radius: 8px; background: var(--border);
    object-fit: cover; flex-shrink: 0;
  }
  .thumb-fallback {
    width: 46px; height: 46px; border-radius: 8px; background: var(--border);
    display: flex; align-items: center; justify-content: center; font-size: 18px;
    flex-shrink: 0; color: var(--muted);
  }
  .item-main { flex: 1; min-width: 0; }
  .item-main .name { font-weight: 600; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item-main .meta { font-size: 12px; color: var(--muted); }
  .stars { color: var(--star); font-size: 14px; white-space: nowrap; }

  #scannerOverlay {
    position: fixed; inset: 0; background: #000; z-index: 50;
    display: flex; flex-direction: column;
  }
  #scannerVideo { flex: 1; width: 100%; object-fit: cover; }
  .scanner-topbar {
    position: absolute; top: 0; left: 0; right: 0; padding: 16px;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(rgba(0,0,0,.55), transparent);
    z-index: 2;
  }
  .scanner-topbar button { background: rgba(255,255,255,.15); color: #fff; }
  .scan-frame {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 78%; max-width: 340px; height: 120px;
    border: 3px solid rgba(255,255,255,.85); border-radius: 14px;
    box-shadow: 0 0 0 2000px rgba(0,0,0,.35);
  }
  .scanner-hint {
    position: absolute; bottom: 30px; left: 0; right: 0; text-align: center;
    color: #fff; font-size: 14px; padding: 0 20px;
  }

  .star-picker { display: flex; gap: 6px; font-size: 34px; }
  .star-picker span { cursor: pointer; color: var(--star-off); }
  .star-picker span.on { color: var(--star); }

  .toggle-group { display: flex; gap: 8px; }
  .toggle-group button { flex: 1; background: var(--card); color: var(--text); border: 1px solid var(--border); font-weight: 500; }
  .toggle-group button.selected { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }

  .history-entry { border-top: 1px solid var(--border); padding: 12px 0; }
  .history-entry:first-child { border-top: none; padding-top: 0; }
  .history-entry .stars { font-size: 16px; }
  .history-entry .hdate { font-size: 12px; color: var(--muted); margin-left: 8px; }
  .history-entry .hnote { font-size: 14px; margin-top: 4px; }
  .history-entry .hprice { font-size: 12px; color: var(--muted); margin-top: 3px; }

  .summary-box { text-align: center; padding: 6px 0 2px; }
  .summary-box .big { font-size: 30px; font-weight: 700; }
  .summary-box .stars { font-size: 20px; display: block; margin: 2px 0; }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 30px;
    font-size: 13px; z-index: 100; opacity: 0; transition: opacity .25s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }

  .spinner {
    width: 22px; height: 22px; border-radius: 50%;
    border: 3px solid var(--border); border-top-color: var(--accent);
    animation: spin .7s linear infinite; margin: 0 auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

// ---------- helpers ----------
function $(id) { return document.getElementById(id); }
function show(id) { $(id).classList.remove('hidden'); }
function hide(id) { $(id).classList.add('hidden'); }
function toast(msg) {
  const t = $('toast');

function starsStr(n) {

// ---------- auth ----------

  hide('authError');

// ---------- home / recent list ----------
async function loadRecent() {
  show('recentLoading');
  hide('recentEmpty');
  $('recentList').innerHTML = '';
  const [{ data: productReviews, error: err1 }, { data: placeReviews, error: err2 }] = await Promise.all([
    sb.from('reviews').select('id, ean, rating, would_buy_again, note, price, store, purchased_at, created_at, products(name, brand, image_url, category)')
      .not('ean', 'is', null).order('created_at', { ascending: false }).limit(200),
    sb.from('reviews').select('id, place_id, rating, would_buy_again, note, price, purchased_at, created_at, places(name, type)')
      .not('place_id', 'is', null).order('created_at', { ascending: false }).limit(200)
  ]);
  hide('recentLoading');
  if (err1 || err2) { toast('Kon geschiedenis niet laden: ' + ((err1 || err2).message)); return; }

  // group by target (ean or place), keep most recent review + avg rating + store/category set per target
  const grouped = new Map();
  for (const r of (productReviews || [])) {
    const key = 'p:' + r.ean;
    if (!grouped.has(key)) {
      grouped.set(key, {
        kind: 'product', ean: r.ean, product: r.products, ratings: [], latest: r.created_at,
        stores: new Set(), category: r.products && r.products.category || null
      });
    }
    const item = grouped.get(key);
    item.ratings.push(r.rating);
    if (r.store) item.stores.add(r.store);
  }
  for (const r of (placeReviews || [])) {
    const key = 'l:' + r.place_id;
    if (!grouped.has(key)) {
      grouped.set(key, {
        kind: 'place', placeId: r.place_id, place: r.places, ratings: [], latest: r.created_at,
        stores: new Set(), category: r.places && r.places.type || null
      });
    }
    grouped.get(key).ratings.push(r.rating);
  }
  allRecent = Array.from(grouped.values()).sort((a, b) => new Date(b.latest) - new Date(a.latest));
  populateFilterOptions(allRecent);
  applyFilters();
}

function renderRecent(list) {
  const container = $('recentList');
  container.innerHTML = '';
  if (list.length === 0) { show('recentEmpty'); return; }
  hide('recentEmpty');
  for (const item of list) {
    const avg = item.ratings.reduce((a, b) => a + b, 0) / item.ratings.length;
    const div = document.createElement('div');
    div.className = 'scan-list-item';
    const isPlace = item.kind === 'place';
    const name = isPlace ? (item.place ? item.place.name : 'Onbekend') : (item.product ? item.product.name : item.ean);
    const subtitle = isPlace ? (item.place && item.place.type ? item.place.type : '') : (item.product && item.product.brand ? item.product.brand : '');
    const img = !isPlace && item.product && item.product.image_url;
    const countLabel = isPlace ? `${item.ratings.length}x geweest` : `${item.ratings.length}x gekocht`;
    div.innerHTML = `
      ${img ? `<img class="thumb" src="${img}">` : `<div class="thumb-fallback">${isPlace ? '🍽️' : '📦'}</div>`}
      <div class="item-main">
        <div class="name">${escapeHtml(name)}</div>
        <div class="meta">${escapeHtml(subtitle)}${subtitle ? ' · ' : ''}${countLabel}</div>
      </div>
      <div class="stars">${starsStr(avg)}</div>
    `;
    div.addEventListener('click', () => isPlace ? openPlace(item.placeId, item.place ? { id: item.placeId, ...item.place } : null) : lookupAndOpen(item.ean));
    container.appendChild(div);
  }
}

$('searchBox').addEventListener('input', applyFilters);
$('filterStore').addEventListener('change', applyFilters);
$('filterCategory').addEventListener('change', applyFilters);

function populateFilterOptions(list) {
  const stores = new Set();
  const categories = new Set();
  for (const item of list) {
    item.stores.forEach(s => stores.add(s));
    if (item.category) categories.add(item.category);
  }
  fillSelect('filterStore', 'Alle winkels', stores);
  fillSelect('filterCategory', 'Alle categorieën', categories);
}

function fillSelect(id, allLabel, values) {
  const el = $(id);
  const current = el.value;
  el.innerHTML = `<option value="">${allLabel}</option>`;
  Array.from(values).sort((a, b) => a.localeCompare(b)).forEach(v => {
    const opt = document.createElement('option');
    opt.value = v;
    opt.textContent = v;
    el.appendChild(opt);
  });
  if (Array.from(values).includes(current)) el.value = current;
}

function applyFilters() {
  const q = $('searchBox').value.trim().toLowerCase();
  const storeFilter = $('filterStore').value;
  const categoryFilter = $('filterCategory').value;
  const filtered = allRecent.filter(item => {
    if (storeFilter && !item.stores.has(storeFilter)) return false;
    if (categoryFilter && item.category !== categoryFilter) return false;
    if (!q) return true;
    if (item.kind === 'place') {
      const name = (item.place && item.place.name || '').toLowerCase();
      const type = (item.place && item.place.type || '').toLowerCase();
      return name.includes(q) || type.includes(q);
    }
    const name = (item.product && item.product.name || '').toLowerCase();
    const brand = (item.product && item.product.brand || '').toLowerCase();
    const category = (item.category || '').toLowerCase();
    const storesText = Array.from(item.stores).join(' ').toLowerCase();
    return name.includes(q) || brand.includes(q) || item.ean.includes(q) || category.includes(q) || storesText.includes(q);
  });
  renderRecent(filtered);
}

function escapeHtml(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

$('btnBackHome').addEventListener('click', () => { switchView('home'); loadRecent(); });

// ---------- places (restaurants/businesses) ----------
$('btnAddPlace').addEventListener('click', () => {
  switchView('place-search');
  $('placeSearchInput').value = '';
  $('placeSearchResults').innerHTML = '';
  hide('btnCreatePlace');
  $('placeSearchInput').focus();
});
$('btnBackHomeFromPlace').addEventListener('click', () => { switchView('home'); loadRecent(); });

let placeSearchDebounce = null;
$('placeSearchInput').addEventListener('input', (e) => {
  clearTimeout(placeSearchDebounce);
  const q = e.target.value.trim();
  if (!q) { $('placeSearchResults').innerHTML = ''; hide('btnCreatePlace'); return; }
  placeSearchDebounce = setTimeout(() => searchPlaces(q), 300);
});

async function searchPlaces(q) {
  const { data } = await sb.from('places').select('*').ilike('name', `%${q}%`).limit(10);
  const container = $('placeSearchResults');
  container.innerHTML = '';
  (data || []).forEach(p => {
    const div = document.createElement('div');
    div.className = 'scan-list-item';
    div.innerHTML = `
      <div class="thumb-fallback">🍽️</div>
      <div class="item-main">
        <div class="name">${escapeHtml(p.name)}</div>
        <div class="meta">${escapeHtml(p.type || '')}</div>
      </div>
    `;
    div.addEventListener('click', () => openPlace(p.id, p));
    container.appendChild(div);
  });
  const exact = (data || []).some(p => p.name.toLowerCase() === q.toLowerCase());
  if (!exact) {
    $('btnCreatePlace').textContent = `+ Nieuw toevoegen: "${q}"`;
    $('btnCreatePlace').onclick = () => createPlace(q);
    show('btnCreatePlace');
  } else {
    hide('btnCreatePlace');
  }
}

async function createPlace(name) {
  const { data, error } = await sb.from('places').insert({ name }).select().single();
  if (error) { toast('Kon niet aanmaken: ' + error.message); return; }
  openPlace(data.id, data);
}

async function openPlace(placeId, place) {
  currentKind = 'place';
  currentPlaceId = placeId;
  currentPlace = place;
  if (!currentPlace) {
    const { data } = await sb.from('places').select('*').eq('id', placeId).maybeSingle();
    currentPlace = data;
  }
  switchView('product');
  resetProductForm();
  applyKindUI();
  renderPlaceHeader(currentPlace);
  hide('manualNameEntry');
  loadHistory();
}

function renderPlaceHeader(p) {
  hide('productImage');
  show('productImageFallback');
  $('productImageFallback').textContent = '🍽️';
  $('productNameDisplay').textContent = p.name;
  $('productBrandDisplay').textContent = p.type || '';
  $('productEanDisplay').textContent = '';
  $('itemCategory').value = p.type || '';
}

function applyKindUI() {
  const isPlace = currentKind === 'place';
  $('categoryLabel').textContent = isPlace ? 'Soort (bijv. Restaurant, Café)' : 'Categorie (optioneel)';
  $('itemCategory').placeholder = isPlace ? 'Restaurant, Café, Bar...' : 'bijv. Snacks, Wijn, Schoonmaak';
  $('buyAgainLabel').textContent = isPlace ? 'Zou je hier opnieuw eten/langsgaan?' : 'Zou je het opnieuw kopen?';
  if (isPlace) hide('storeField'); else show('storeField');
}

// ---------- scanner ----------
$('btnOpenScanner').addEventListener('click', openScanner);
$('btnCloseScanner').addEventListener('click', closeScanner);
$('btnSwitchCamera').addEventListener('click', switchCamera);

function buildBarcodeHints(tryHarder) {
  const hints = new Map();
  hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [
    ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8,
    ZXing.BarcodeFormat.UPC_A, ZXing.BarcodeFormat.UPC_E
  ]);
  if (tryHarder) hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
  return hints;
}

function getSavedCameraId() {
  try { return localStorage.getItem('koopgeheugen_camera_id'); } catch (e) { return null; }
}

function saveCameraId(id) {
  if (!id) return;
  try { localStorage.setItem('koopgeheugen_camera_id', id); } catch (e) {}
}

async function openScanner() {
  show('scannerOverlay');
  $('scannerHint').textContent = 'Camera wordt gestart...';
  codeReader = new ZXing.BrowserMultiFormatReader(buildBarcodeHints(false));
  availableCameras = [];
  currentCameraIndex = 0;
  const savedId = getSavedCameraId();
  const started = savedId && await startCameraStream(
    { video: { deviceId: { exact: savedId }, width: { ideal: 1920 }, height: { ideal: 1080 } } },
    /* silent */ true
  );
  if (!started) {
    await startCameraStream({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }
    });
  }
  try {
    const devices = await navigator.mediaDevices.enumerateDevices();
    availableCameras = devices.filter(d => d.kind === 'videoinput');
    if (availableCameras.length > 1) show('btnSwitchCamera'); else hide('btnSwitchCamera');
    const activeDeviceId = currentStream && currentStream.getVideoTracks()[0].getSettings().deviceId;
    const idx = availableCameras.findIndex(d => d.deviceId === activeDeviceId);
    if (idx >= 0) currentCameraIndex = idx;
  } catch (e) {}
}

async function switchCamera() {
  if (availableCameras.length < 2) return;
  currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
  const device = availableCameras[currentCameraIndex];
  $('scannerHint').textContent = 'Wisselen naar andere camera...';
  await startCameraStream({ video: { deviceId: { exact: device.deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
}

async function startCameraStream(constraints, silent) {
  if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  if (codeReader) { try { codeReader.reset(); } catch (e) {} }
  codeReader = new ZXing.BrowserMultiFormatReader(buildBarcodeHints(false));
  try {
    const stream = await navigator.mediaDevices.getUserMedia(constraints);
    currentStream = stream;
    await applyContinuousFocus(stream);
    const video = $('scannerVideo');
    video.srcObject = stream;
    await video.play();
    codeReader.decodeFromVideoElement(video, (result, err) => {
      if (result) {
        handleScanResult(result.getText());
      }
    });
    $('scannerHint').textContent = 'Richt de camera op de barcode';
    return true;
  } catch (e) {
    if (silent) return false;
    let msg = 'Kon camera niet openen: ' + (e && e.message ? e.message : e);
    if (e && e.name === 'NotAllowedError') {
      msg = 'Camera-toegang is geblokkeerd. Tik op het slotje naast de adresbalk, zet Camera op "Toestaan" en probeer opnieuw.';
    } else if (e && e.name === 'NotFoundError') {
      msg = 'Geen camera gevonden op dit toestel.';
    }
    $('scannerHint').textContent = msg;
    return false;
  }
}

async function applyContinuousFocus(stream) {
  const track = stream.getVideoTracks()[0];
  if (!track || !track.getCapabilities) return;
  const caps = track.getCapabilities();
  if (caps.focusMode && caps.focusMode.includes('continuous')) {
    try { await track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }); } catch (e) {}
  }
}

$('scannerVideo').addEventListener('click', () => {
  if (currentStream) applyContinuousFocus(currentStream);
});

function closeScanner() {
  if (codeReader) { try { codeReader.reset(); } catch (e) {} codeReader = null; }
  if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  $('scannerVideo').srcObject = null;
  availableCameras = [];
  hide('btnSwitchCamera');
  hidePhotoDebug();
  hide('scannerOverlay');
}

function handleScanResult(ean) {
  if (currentStream) {
    const settings = currentStream.getVideoTracks()[0].getSettings();
    if (settings.deviceId) saveCameraId(settings.deviceId);
  }
  closeScanner();
  toast('Gescand: ' + ean);
  lookupAndOpen(ean);
}

// ---------- still-photo capture, taken in-page from the live stream (no app switch, no page reload risk) ----------
$('btnTakePhoto').addEventListener('click', takeStillPhoto);

async function takeStillPhoto() {
  const video = $('scannerVideo');
  if (!video.videoWidth || !video.videoHeight) {
    showPhotoDebug('Camera nog niet klaar, wacht heel even en probeer opnieuw.');
    return;
  }
  try {
    showPhotoDebug('Foto vastleggen...');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const dataUrl = canvas.toDataURL('image/jpeg', 0.92);
    await decodeImageUrlForBarcode(dataUrl);
  } catch (err) {
    showPhotoDebug('Foto nemen mislukt: ' + (err && err.message ? err.message : err));
  }
}

async function decodeImageUrlForBarcode(url) {
  showPhotoDebug('Barcode zoeken (kan even duren)...');
  try {
    const reader = new ZXing.BrowserMultiFormatReader(buildBarcodeHints(true));
    const result = await reader.decodeFromImageUrl(url);
    hidePhotoDebug();
    handleScanResult(result.getText());
  } catch (err) {
    showPhotoDebug('Geen barcode gevonden (' + (err && err.message ? err.message : 'onbekende fout') + '). Richt beter/dichterbij en probeer opnieuw.');
  }
}

async function decodeBlobForBarcode(blob) {
  const url = URL.createObjectURL(blob);
  try {
    await decodeImageUrlForBarcode(url);
  } finally {
    URL.revokeObjectURL(url);
  }
}

$('btnPhotoScan').addEventListener('click', () => {
  showPhotoDebug('Camera-app openen...');
  $('photoInput').click();
});

$('photoInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  $('photoInput').value = '';
  if (!file) { showPhotoDebug('Geen foto ontvangen van de camera-app.'); return; }
  showPhotoDebug('Foto ontvangen (' + Math.round(file.size / 1024) + ' KB), barcode zoeken...');
  await decodeBlobForBarcode(file);
});

function showPhotoDebug(msg) {
  for (const id of ['photoDebug', 'homePhotoDebug']) {
    const el = $(id);
    if (!el) continue;
    el.textContent = msg;
    show(id);
  }
}

function hidePhotoDebug() {
  hide('photoDebug');
  hide('homePhotoDebug');
}

$('btnManualLookup').addEventListener('click', () => {
  const ean = $('manualEan').value.trim();
  if (!ean) return;
  lookupAndOpen(ean);
});

// ---------- product lookup ----------
async function lookupAndOpen(ean) {
  currentKind = 'product';
  currentEan = ean;
  switchView('product');
  resetProductForm();
  applyKindUI();
  $('productNameDisplay').textContent = 'Zoeken...';
  $('productBrandDisplay').textContent = '';
  $('productEanDisplay').textContent = ean;
  hide('historyCard');
  hide('manualNameEntry');

  // 1. check own cache
  let { data: existing } = await sb.from('products').select('*').eq('ean', ean).maybeSingle();
  if (existing) {
    currentProduct = existing;
    renderProductHeader(existing);
    loadHistory();
    return;
  }

  // 2. try Open Food Facts
  let product = await tryFetch(`https://world.openfoodfacts.org/api/v2/product/${ean}.json?fields=product_name,brands,image_url,categories`);
  let name = product && product.status === 1 ? product.product.product_name : null;
  let brand = product && product.status === 1 ? product.product.brands : null;
  let image = product && product.status === 1 ? product.product.image_url : null;
  let category = product && product.status === 1 ? firstCategory(product.product.categories) : null;

  // 3. try Open Products Facts if not found
  if (!name) {
    let p2 = await tryFetch(`https://world.openproductsfacts.org/api/v2/product/${ean}.json?fields=product_name,brands,image_url,categories`);
    if (p2 && p2.status === 1) {
      name = p2.product.product_name;
      brand = p2.product.brands;
      image = p2.product.image_url;
      category = firstCategory(p2.product.categories);
    }
  }

  if (name) {
    currentProduct = { ean, name, brand, image_url: image, category, source: 'openfoodfacts' };
    await sb.from('products').upsert(currentProduct);
    renderProductHeader(currentProduct);
    loadHistory();
  } else {
    currentProduct = { ean, name: null, brand: null, image_url: null, category: null, source: 'manual' };
    renderProductHeader(currentProduct);
    show('manualNameEntry');
    loadHistory();
  }
}

function firstCategory(categories) {
  if (!categories) return null;
  const first = categories.split(',')[0].trim();
  return first.replace(/^\w+:/, '') || null;
}

async function tryFetch(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) return null;
    return await res.json();
  } catch (e) { return null; }
}

function renderProductHeader(p) {
  if (p.image_url) {
    $('productImage').src = p.image_url;
    show('productImage'); hide('productImageFallback');
  } else {
    hide('productImage'); show('productImageFallback');
    $('productImageFallback').textContent = '📦';
  }
  $('productNameDisplay').textContent = p.name || 'Onbekend product';
  $('productBrandDisplay').textContent = p.brand || '';
  $('productEanDisplay').textContent = p.ean;
  $('itemCategory').value = p.category || '';
}

async function loadHistory() {
  const isPlace = currentKind === 'place';
  let query = sb.from('reviews').select('*').order('purchased_at', { ascending: false });
  query = isPlace ? query.eq('place_id', currentPlaceId) : query.eq('ean', currentEan);
  const { data, error } = await query;
  if (error || !data || data.length === 0) { hide('historyCard'); return; }

  const avg = data.reduce((a, b) => a + b.rating, 0) / data.length;
  $('summaryStars').textContent = starsStr(avg);
  $('summaryAvg').textContent = avg.toFixed(1);
  $('summaryCount').textContent = isPlace
    ? `Gemiddeld over ${data.length} keer geweest`
    : `Gemiddeld over ${data.length} keer gekocht`;

  const list = $('historyList');
  list.innerHTML = '';
  for (const r of data) {
    const div = document.createElement('div');
    div.className = 'history-entry';
    const buyAgainLabel = r.would_buy_again === true ? (isPlace ? '✅ opnieuw' : '✅ opnieuw kopen') : r.would_buy_again === false ? (isPlace ? '❌ niet opnieuw' : '❌ niet opnieuw') : '🤔 twijfel';
    div.innerHTML = `
      <span class="stars">${starsStr(r.rating)}</span>
      <span class="hdate">${formatDate(r.purchased_at)} · ${buyAgainLabel}</span>
      ${r.store ? `<div class="hprice">🏬 ${escapeHtml(r.store)}</div>` : ''}
      ${r.note ? `<div class="hnote">${escapeHtml(r.note)}</div>` : ''}
      ${r.price ? `<div class="hprice">€ ${Number(r.price).toFixed(2)}</div>` : ''}
    `;
    list.appendChild(div);
  }
  show('historyCard');
}

function formatDate(d) {
  const dt = new Date(d + 'T00:00:00');
  return dt.toLocaleDateString('nl-NL', { day: 'numeric', month: 'short', year: 'numeric' });
}

// ---------- review form ----------
function resetProductForm() {
  selectedRating = 0;
  selectedBuyAgain = undefined;
  document.querySelectorAll('#starPicker span').forEach(s => s.classList.remove('on'));
  document.querySelectorAll('#buyAgainGroup button').forEach(b => b.classList.remove('selected'));
  $('reviewNote').value = '';
  $('reviewPrice').value = '';
  $('reviewStore').value = '';
  $('reviewDate').value = new Date().toISOString().slice(0, 10);
  hide('productError');
  $('manualProductName').value = '';
  $('manualProductBrand').value = '';
  $('itemCategory').value = '';
}

$('starPicker').addEventListener('click', (e) => {
  if (e.target.tagName !== 'SPAN') return;
  selectedRating = Number(e.target.dataset.v);
  document.querySelectorAll('#starPicker span').forEach(s => {
    s.classList.toggle('on', Number(s.dataset.v) <= selectedRating);
  });
});

$('buyAgainGroup').addEventListener('click', (e) => {
  if (e.target.tagName !== 'BUTTON') return;
  const v = e.target.dataset.v;
  selectedBuyAgain = v === 'true' ? true : v === 'false' ? false : null;
  document.querySelectorAll('#buyAgainGroup button').forEach(b => b.classList.remove('selected'));
  e.target.classList.add('selected');
});

$('btnSaveReview').addEventListener('click', async () => {
  hide('productError');
  if (!selectedRating) {
    $('productError').textContent = 'Kies een aantal sterren.';
    show('productError');
    return;
  }

  if (currentKind === 'product') {
    const category = $('itemCategory').value.trim() || null;
    // if product unknown, require manual name and save it
    if (!currentProduct.name) {
      const manualName = $('manualProductName').value.trim();
      if (!manualName) {
        $('productError').textContent = 'Vul een productnaam in.';
        show('productError');
        return;
      }
      currentProduct = {
        ean: currentEan,
        name: manualName,
        brand: $('manualProductBrand').value.trim() || null,
        image_url: null,
        category,
        source: 'manual'
      };
    } else {
      currentProduct = { ...currentProduct, category };
    }
    const { error: upErr } = await sb.from('products').upsert(currentProduct);
    if (upErr) {
      $('productError').textContent = 'Kon product niet opslaan: ' + upErr.message;
      show('productError');
      return;
    }
  } else {
    const type = $('itemCategory').value.trim() || null;
    if (type !== (currentPlace.type || null)) {
      currentPlace = { ...currentPlace, type };
      await sb.from('places').update({ type }).eq('id', currentPlaceId);
    }
  }

  const btn = $('btnSaveReview');
  btn.disabled = true;
  const { error } = await sb.from('reviews').insert({
    user_id: currentUser.id,
    ean: currentKind === 'product' ? currentEan : null,
    place_id: currentKind === 'place' ? currentPlaceId : null,
    rating: selectedRating,
    would_buy_again: selectedBuyAgain === undefined ? null : selectedBuyAgain,
    note: $('reviewNote').value.trim() || null,
    store: currentKind === 'product' ? ($('reviewStore').value.trim() || null) : null,
    price: $('reviewPrice').value ? Number($('reviewPrice').value) : null,
    purchased_at: $('reviewDate').value || new Date().toISOString().slice(0, 10)
  });
  btn.disabled = false;

  if (error) {
    $('productError').textContent = 'Opslaan mislukt: ' + error.message;
    show('productError');
    return;
  }
  toast('Beoordeling opgeslagen!');
  if (currentKind === 'product') {
    renderProductHeader(currentProduct);
    hide('manualNameEntry');
  } else {
    renderPlaceHeader(currentPlace);
  }
  loadHistory();
  resetProductForm();
});

// ---------- init ----------
(async function init() {
  const { data: { session } } = await sb.auth.getSession();
  currentUser = session ? session.user : null;
  if (currentUser) {
    $('homeGreeting').textContent = currentUser.email + ' · build v19';
    switchView('home');
    loadRecent();
  } else {
    switchView('auth');
  }
})();
</script>
